<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FaraBag | کیف‌های لوکس زنانه</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #090909;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 25px 20px;
      text-align: center;
      border-bottom: 1px solid #b99a5b;
    }

    .logo {
      color: #d6b66a;
      font-size: 34px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    .subtitle {
      margin-top: 8px;
      color: #ccc;
      font-size: 14px;
    }

    .hero {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    .hero h1 {
      color: #d6b66a;
      font-size: 32px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #ccc;
      margin-bottom: 28px;
    }

    /* عکس اصلی FaraBag */
    .product-image {
      width: min(90%, 520px);
      max-height: 620px;
      object-fit: contain;
      border-radius: 18px;
      border: 1px solid #b99a5b;
      box-shadow: 0 0 40px rgba(214, 182, 106, 0.25);
    }

    .buttons {
      margin-top: 28px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .instagram {
      background: #d6b66a;
      color: #111;
    }

    .contact {
      border: 1px solid #d6b66a;
      color: #d6b66a;
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #888;
      border-top: 1px solid #222;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">FaraBag</div>
    <div class="subtitle">کیف‌های خاص و لوکس زنانه</div>
  </header>

  <main class="hero">

    <h1>FaraBag</h1>
    <p>انتخابی برای خاص‌پسندها</p>

    <!-- تصویر اصلی محصول -->
    <img
      class="product-image"
      src="farabag1.jpeg"
      alt="کیف لوکس FaraBag">

    <div class="buttons">

      <a
        class="btn instagram"
        href="https://www.instagram.com/faraa.bag"
        target="_blank">
        Instagram
      </a>

      <a
        class="btn contact"
        href="tel:09023631213">
        تماس با ما
      </a>

    </div>

  </main>

  <footer>
    © 2026 FaraBag — All Rights Reserved
  </footer>

</body>
</html>
